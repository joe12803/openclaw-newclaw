name: Build, Deploy and Auto-Sync Memory

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 确保有写入权限
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库（含记忆数据）
      - name: Checkout code (with memory)
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # 不使用默认 GITHUB_TOKEN

      # 2. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 缓存 OpenClaw（加速构建）
      - name: Cache OpenClaw
        uses: actions/cache@v4
        with:
          path: ~/.openclaw
          key: ${{ runner.os }}-openclaw
          restore-keys: |
            ${{ runner.os }}-openclaw

      # 4. 构建 Docker 镜像（如有 Dockerfile）
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: jupyterlab-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. 安装 OpenClaw（可选，根据你的项目需要）
      - name: Install OpenClaw on Runner
        run: |
          curl -fsSL https://openclaw.ai/install.sh | bash || echo "OpenClaw install script finished (or skipped)"

      # 6. 启动容器、隧道，并开启自动同步
      - name: Start JupyterLab, Tunnel and Auto-Sync
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}    # 你的 PAT，需有 repo 权限
        run: |
          # ---------- 启动容器 ----------
          echo "Starting Docker container..."
          docker run -d -p 7860:7860 \
            --name jupyter-container \
            -v "$(pwd)":/root/.openclaw \
            jupyterlab-image:latest || { echo "Docker run failed!"; exit 1; }

          # ---------- 配置 Git（宿主机） ----------
          git config --global user.email "joe12803@gmail.com"
          git config --global user.name "joe12803"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/joe12803/openclaw-newclaw.git"

          # ---------- 启动自动推送后台任务 ----------
          echo "Starting auto-commit loop (every 5 minutes)..."
          (
            while true; do
              sleep 300   # 5 分钟
              echo "$(date): Checking for memory changes..."

              # 添加所有变更（重点是我们关心的文件/目录）
              git add -A

              # 如果有变更则提交并推送
              if git diff --cached --quiet; then
                echo "No changes to commit."
              else
                git commit -m "Auto-sync memory at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
                git push origin HEAD:main --force
                echo "Pushed successfully."
              fi
            done
          ) &   # 放入后台

          # ---------- 安装 Cloudflare Tunnel ----------
          echo "Installing cloudflared..."
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          # ---------- 启动隧道并获取 URL ----------
          echo "Starting Cloudflare Tunnel..."
          cloudflared tunnel --url http://localhost:7860 > tunnel.log 2>&1 &
          sleep 5

          for i in $(seq 1 15); do
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            echo "Waiting for tunnel URL... ($i/15)"
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get Tunnel URL!"
            cat tunnel.log
            exit 1
          fi

          echo "---------------------------------------------------"
          echo "JupyterLab is now live!"
          echo "Public URL: ${TUNNEL_URL}/lab?token=ab87036181"
          echo "Token: ab87036181"
          echo "Auto-sync is active – changes will be pushed to GitHub every 5 minutes."
          echo "---------------------------------------------------"

          # ---------- 保持运行 1 小时 ----------
          sleep 3600

          # 结束后清理后台任务（可选）
          kill %1   # 停止自动推送循环
