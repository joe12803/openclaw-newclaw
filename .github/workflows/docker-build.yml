name: Build, Deploy and Auto-Sync Memory

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-container
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ !startsWith(github.event.head_commit.message, 'Auto-sync memory') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with memory)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache OpenClaw
        uses: actions/cache@v4
        with:
          path: ~/.openclaw
          key: ${{ runner.os }}-openclaw
          restore-keys: |
            ${{ runner.os }}-openclaw

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: jupyterlab-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install OpenClaw on Runner
        run: |
          echo "Installing OpenClaw..."
          # 将脚本下载到文件，避免管道与 /dev/null 冲突
          curl -fsSL https://openclaw.ai/install.sh -o /tmp/install_openclaw.sh
          # 尝试以非交互模式运行（如果脚本支持 --yes 参数）
          if bash /tmp/install_openclaw.sh --yes </dev/null; then
            echo "OpenClaw installed successfully."
            # 确保 openclaw 命令在 PATH 中
            export PATH="$HOME/.npm-global/bin:$PATH"
            openclaw --version || echo "openclaw command not found (may not be needed)"
          else
            echo "OpenClaw installation failed, but continuing as it may be optional."
          fi

      - name: Start JupyterLab, Tunnel and Auto-Sync
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Starting Docker container..."
          docker run -d -p 7860:7860 \
            --name jupyter-container \
            -v "$(pwd)":/root/.openclaw \
            -w /root/.openclaw \
            jupyterlab-image:latest || { echo "Docker run failed!"; exit 1; }

          git config --global user.email "joe12803@gmail.com"
          git config --global user.name "joe12803"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/joe12803/openclaw-newclaw.git"

          # 创建自动同步脚本（基于原来的 while 循环逻辑）
          cat > /tmp/openclaw_loop_sync.sh << 'EOF'
          #!/bin/bash
          # 自动同步脚本：每5分钟检查并推送变更
          while true; do
            sleep 300
            echo "$(date): Checking for changes..."
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit."
            else
              git commit -m "Auto-sync memory at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              git push origin HEAD:main --force
              echo "Pushed successfully."
            fi
          done
          EOF

          chmod +x /tmp/openclaw_loop_sync.sh

          echo "Starting auto-commit loop (every 5 minutes)..."
          /tmp/openclaw_loop_sync.sh &

          echo "Installing cloudflared..."
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          echo "Starting Cloudflare Tunnel..."
          cloudflared tunnel --url http://localhost:7860 > tunnel.log 2>&1 &
          sleep 5

          for i in $(seq 1 15); do
            TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" tunnel.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            echo "Waiting for tunnel URL... ($i/15)"
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get Tunnel URL!"
            cat tunnel.log
            exit 1
          fi

          echo "---------------------------------------------------"
          echo "JupyterLab is now live!"
          echo "Public URL: ${TUNNEL_URL}/lab?token=ab87036181"
          echo "Token: ab87036181"
          echo "Auto-sync is active – changes will be pushed to GitHub every 5 minutes."
          echo "---------------------------------------------------"

          sleep 3600

          echo "Performing final sync..."
          git add -A
          if git diff --cached --quiet; then
            echo "No final changes to push."
          else
            git commit -m "Final sync at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:main --force || echo "Final push failed (ok if nothing to push)"
          fi

          # 停止后台循环脚本
          kill %1 || true
